      <span class="artdeco-entity-lockup__degree">· 2nd</span>

    </li>
    <li class="artdeco-list__item"><input type="checkbox" class="row-select" aria-label="Select result">
      <img data-anonymize="headshot-photo" src="https://media.licdn.com/dms/image/b.jpg">
      <a data-anonymize="person-name" href="/sales/lead/ACwAAAdef456,NAME_SEARCH,xyz2"><span aria-hidden="true">Bob Okafor is reachable</span></a>
      <span class="artdeco-entity-lockup__degree">· 3rd</span>
      <span data-anonymize="title">Chief Revenue Officer</span>

    </li>
  </ol>
</div>

<script>
  // Mimic Sales Navigator: the page itself loads the lead-search API after render.
  window.addEventListener("load", () => {
    const xhr = new XMLHttpRequest();
    xhr.open("GET", "/sales-api/salesApiLeadSearch?q=searchQuery&query=cro&start=0&count=25");
    xhr.setRequestHeader("x-restli-protocol-version", "2.0.0");
    xhr.send();
    fetch("/voyager/api/graphql?queryId=voyagerSearchDashClusters").then((r) => r.text());
  });
</script>
</body></html>
