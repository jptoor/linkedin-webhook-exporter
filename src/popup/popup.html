<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #111; }
  header { padding: 12px 14px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
  header b { font-size: 14px; }
  section { padding: 10px 14px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 12px; color: #444; }
  .kv b { color: #111; }
  ul { list-style: none; padding: 0; margin: 6px 0 0; max-height: 220px; overflow: auto; }
  li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid #f1f3f5; font-size: 12px; }
  .pill { border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 600; }
  .sent { background: #dafbe1; color: #1a7f37; } .pending { background: #fff8c5; color: #9a6700; } .failed { background: #ffebe9; color: #b42318; } .sending { background: #ddf4ff; color: #0969da; }
  .actions { display: flex; gap: 8px; padding: 10px 14px 14px; }
  button { appearance: none; border: 0; border-radius: 6px; padding: 7px 10px; background: #f1eff5; color: #1C112A; font-weight: 600; font-size: 12px; cursor: pointer; }
  button.primary { background: #1C112A; color: #fff; }
  a { color: #1C112A; text-decoration: none; font-size: 12px; }
  .muted { color: #6b7280; }
  #log li { display: block; }
  #log .k { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #6b6478; margin-right: 6px; }
  #log .t { color: #9ca3af; font-size: 10px; float: right; }
  .brand { display: flex; align-items: center; gap: 7px; }
  footer { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px 12px; border-top: 1px solid #f1f3f5; font-size: 11px; }
  footer img { display: block; opacity: .85; }
</style>
</head>
<body>
<header><span class="brand"><img src="brand/deepline-mark.svg" alt="" width="16" height="16"><b>LinkedIn Webhook Exporter</b></span><a id="options" href="#">Options</a></header>
<section>
  <div class="kv">
    <span>Webhook</span><b id="webhook" class="muted">not set</b>
    <span>Captured today</span><b id="sentToday">0</b>
    <span>Remaining today</span><b id="remaining">0</b>
    <span>Profiles remembered</span><b id="dedupeCount">0</b>
  </div>
</section>
<section id="export">
  <div><b>Export a search</b> <span class="muted">(Sales Navigator search or list, LinkedIn people search)</span></div>
  <div id="exportForm" style="margin-top:6px; display:flex; gap:6px; flex-wrap:wrap">
    <input id="exportUrl" type="url" placeholder="https://www.linkedin.com/sales/search/people?…" style="flex:1 1 100%; padding:6px 8px; border:1px solid #d0d7de; border-radius:6px; font-size:12px">
    <input id="exportLimit" type="number" min="1" max="2500" style="width:70px; padding:6px 8px; border:1px solid #d0d7de; border-radius:6px; font-size:12px" title="Max results">
    <button id="exportStart" class="primary">Export all pages</button>
  </div>
  <div id="exportProgress" hidden style="margin-top:6px">
    <div id="exportText" class="muted"></div>
    <div style="display:flex; gap:6px; margin-top:6px">
      <button id="exportPause">Pause</button>
      <button id="exportStop">Stop</button>
    </div>
  </div>
  <div id="exportError" class="muted" style="color:#b42318"></div>
</section>
<section>
  <div><b>Recent sends</b></div>
  <ul id="queue"></ul>
</section>
<div class="actions">
  <button id="retry">Retry failed</button>
  <button id="clear">Clear history</button>
</div>
<section>
  <div style="display:flex; justify-content:space-between; align-items:center"><b>Activity</b><a id="openLog" href="#">Full log</a></div>
  <ul id="log"></ul>
</section>
<footer><a href="https://deepline.com/?utm_source=linkedin-webhook-exporter" target="_blank" rel="noopener"><img src="brand/deepline-wordmark.svg" alt="Deepline" height="12"></a><span class="muted">Open source · MIT</span></footer>
<script type="module" src="popup.js"></script>
</body>
</html>
